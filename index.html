<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>叮咚客戶</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="叮咚客戶">
<meta name="theme-color" content="#0F6B5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 單欄手機 app — 頂部標題、可捲動內容、底部分頁列；表單以底部抽屜開啟 */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --ink:#16302A; --muted:#5A6D67; --line:#D8E1DD;
  --accent:#0F6B5C; --accent-ink:#FFFFFF; --accent-soft:#DCEDE8;
  --c-meet:#A63D6B; --c-prop:#2F5DA8; --c-deal:#0F7A55; --c-anni:#A86200; --c-age:#6A4C9C; --c-rider:#B3362B; --c-wait:#1F6F8B; --c-fund:#5E6B10;
  --warn-bg:#FBEDEA;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1715; --surface:#17221F; --ink:#E4EEEA; --muted:#97AAA4; --line:#2A3833;
  --accent:#4CC2A8; --accent-ink:#06231C; --accent-soft:#1D3A33;
  --c-meet:#EE8DB5; --c-prop:#86A9EA; --c-deal:#5CCB9A; --c-anni:#E8A847; --c-age:#B49BE3; --c-rider:#F0877C; --c-wait:#72C6E4; --c-fund:#C8D86E;
  --warn-bg:#3A2220; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1715; --surface:#17221F; --ink:#E4EEEA; --muted:#97AAA4; --line:#2A3833;
  --accent:#4CC2A8; --accent-ink:#06231C; --accent-soft:#1D3A33;
  --c-meet:#EE8DB5; --c-prop:#86A9EA; --c-deal:#5CCB9A; --c-anni:#E8A847; --c-age:#B49BE3; --c-rider:#F0877C; --c-wait:#72C6E4; --c-fund:#C8D86E;
  --warn-bg:#3A2220; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:.04em}
.brand small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:0;font-weight:400}
.datebox{text-align:right;font-family:var(--f-num);font-size:13px;color:var(--muted)}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:18px;padding-block:16px}
h2{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin:0;display:flex;align-items:center;gap:8px}
h2 .count{font-family:var(--f-num);background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:0 8px;font-size:12px}
.section{display:flex;flex-direction:column;gap:10px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (min-width:540px){.summary{grid-template-columns:repeat(8,1fr)}}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;min-width:0}
.sum b{display:block;font-family:var(--f-num);font-size:20px;line-height:1.2}
.sum span{font-size:11px;color:var(--muted)}
.task{cursor:pointer;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.task.overdue{background:var(--warn-bg)}
.task .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;color:var(--tc);border:1px solid var(--tc);border-radius:6px;padding:0 6px;white-space:nowrap}
.task .who{font-weight:700;font-size:16px}
.task .when{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--muted);white-space:nowrap}
.task .detail{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:14px;display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.line{color:#06C755;border-color:#06C755}
.btn.danger{color:var(--c-rider);border-color:var(--c-rider)}
.btn.small{padding:3px 10px;font-size:13px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:14px}
.seg{display:flex;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:3px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.client{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.client .meta{min-width:0;flex:1}
.client .meta b{display:block;font-size:16px}
.client .meta span{font-size:12px;color:var(--muted)}
.tag{font-size:11px;background:var(--line);color:var(--muted);border-radius:4px;padding:0 5px;margin-left:6px;font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.step{font-family:var(--f-num);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--surface)}
.step.done{background:var(--accent-soft);color:var(--accent);border-color:transparent;text-decoration:line-through}
.step.due{border-color:var(--c-rider);color:var(--c-rider)}
.backlink{background:none;border:none;color:var(--accent);padding:0;font-size:14px;align-self:flex-start}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:1fr 1fr 1fr auto 1fr 1fr;align-items:center;gap:4px;padding-block:6px}
nav.tabs button.tab{background:none;border:none;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);padding:4px 0;gap:2px}
nav.tabs button.tab svg{width:22px;height:22px}
nav.tabs button.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.fab{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:none;font-size:30px;line-height:1;margin-top:-22px;box-shadow:0 4px 14px rgb(0 0 0 / .2)}
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-family:var(--f-display);font-size:19px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:700}
.field .hint{font-size:12px;color:var(--muted)}
.field .err{font-size:12px;color:var(--c-rider)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;width:100%;min-width:0}
.inline{display:flex;gap:8px;align-items:center}
.inline > *{min-width:0}
.sheet .actions{justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;z-index:30}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
textarea{resize:vertical}
.task .go{color:var(--muted);font-size:18px;line-height:1;margin-left:2px}
.task:active{filter:brightness(.97)}
.nameinput{font-size:20px;font-weight:700;border:1px solid transparent;border-bottom:1px dashed var(--line);background:transparent;border-radius:6px 6px 0 0;padding:4px 6px;width:100%;min-width:0}
.nameinput:hover,.nameinput:focus{border-color:var(--line);background:var(--bg)}
.bdu{font-size:14px;gap:6px}
.bdu input{width:auto!important}
select:disabled{opacity:.45}
.saved{font-size:12px;color:var(--muted);text-align:right}
.pcard{cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.pcard .hint{font-size:12px;color:var(--muted)}
.stage{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--sc);color:var(--surface);font-family:var(--f-num);font-size:13px;font-weight:700;flex:none}
.avatar.st{background:var(--sc);color:var(--surface);font-family:var(--f-num);font-size:18px}
.stagepick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stagepick button{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;font-size:13px;min-width:0}
.stagepick button b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;border:1.5px solid var(--sc);color:var(--sc);font-family:var(--f-num);flex:none}
.stagepick button[aria-pressed="true"]{border-color:var(--sc);box-shadow:inset 0 0 0 1px var(--sc);font-weight:700}
.stagepick button[aria-pressed="true"] b{background:var(--sc);color:var(--surface)}
.opp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.opp.done{opacity:.6}
.opp .txt{white-space:pre-wrap;font-size:15px;overflow-wrap:anywhere}
.opp .meta{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.match{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.match button{border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:14px;padding:1px 10px;font-size:13px}
.tip{font-size:13px;background:var(--accent-soft);border-radius:6px;padding:6px 8px;color:var(--ink)}
.tip b{color:var(--accent)}
.ctags{display:flex;flex-wrap:wrap;gap:4px}
.ctag{font-size:12px;border-radius:10px;padding:0 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.tagpick button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:4px 12px;font-size:14px}
.tagpick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.step.rest{border-style:dashed;color:var(--muted);text-decoration:none;background:transparent}
.stepedit{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.stepedit .inline label{font-weight:700;font-size:13px;white-space:nowrap}
.stepedit input[type=number]{width:70px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">叮咚客戶<small>追蹤、關懷、成交，叮咚一次搞定</small></div>
  <div class="datebox" id="todayLabel"></div>
</div></header>

<main><div class="wrap" id="view"></div></main>

<nav class="tabs"><div class="wrap">
  <button class="tab" data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>今日</button>
  <button class="tab" data-tab="upcoming"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>即將</button>
  <button class="tab" data-tab="opps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>商機</button>
  <button class="fab" id="fab" aria-label="新增客戶">+</button>
  <button class="tab" data-tab="clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5-5-5.5"/></svg>客戶</button>
  <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>設定</button>
</div></nav>

<div id="sheetRoot"></div>

<script>
(function(){
"use strict";
/* ---------- 儲存（只存在這支手機的瀏覽器裡） ---------- */
const KEY="agentReminder.v1";
const DEFAULT_SETTINGS={
  proposalDays:[1,3,7,14],
  dealDays:[1,7,30,90],
  anniLead:30,
  ageLead:30,
  riderLead:14,
  fundDays:12,
  dealSteps:[
    {day:1,title:"整理這次買了什麼",tip:"把商品、保費、等待期寫清楚，客戶安心，也減少日後誤會。",tpl:"{name}您好，謝謝您的信任！幫您整理這次規劃的內容：\n・商品：{item}\n・保費：{premium}\n・等待期：{waits}\n等待期過後保障就完整生效，到時候我會再提醒您。有任何問題隨時問我！"},
    {day:7,title:"查核保進度：有照會就主動聯絡，保單下來就約簽收",tip:"先查核保進度，再選一則傳：有照會就說明要補什麼；保單核發了就約時間簽收。",
     alts:[{label:"有照會",tpl:"{name}您好，保險公司那邊有一些資料想再跟您確認（照會內容：　　），我先幫您整理好需要準備的東西。方便的話我們約個時間處理，越快補件，保單就越快下來。"},
           {label:"約簽收",tpl:"{name}您好，好消息！您的{item}保單已經核發下來了，想約時間把保單送過去給您簽收，順便花 15 分鐘說明理賠怎麼申請。{next1}或{next2}哪天方便呢？"}]},
    {day:30,title:"成交關懷"},
    {day:90,title:"成交關懷"}
  ],
  waitSteps:[
    {day:30,title:"疾病等待期結束",tip:"讓客戶知道保障正式啟動，也提醒他有狀況先找你。",tpl:"{name}您好，跟您報告一個好消息：您的{item}從今天起已經過了 30 天的疾病等待期，之後因為疾病住院或手術都在保障範圍內了。有任何狀況隨時找我！"},
    {day:90,title:"癌症等待期結束",tip:"順便提醒定期健康檢查，展現關心。",tpl:"{name}您好，您的{item}已經過了 90 天的癌症等待期，癌症相關的保障從今天起正式生效。也提醒您記得定期做健康檢查喔！"},
    {day:365,title:"重大傷病等待期結束",tip:"滿一年是回訪和請客戶介紹朋友的好時機。",tpl:"{name}您好，您的{item}滿一年了，重大傷病的等待期也已經結束，保障都完整生效了。謝謝您這一年的信任，想約個時間聊聊這一年的變化，看看保障需不需要調整？"}
  ],
  meetSteps:[
    {day:0,title:"當天晚上：整理今天的三個重點",tip:"只寫他說的，不寫你要賣的。",tpl:"{name}您好，今天謝謝您撥時間！今天聊到的三個重點，我整理給您：\n1. \n2. \n3. "},
    {day:2,silent:true,title:"什麼都不傳",tip:"讓他有時間想，也讓他發現你不急。",tpl:""},
    {day:3,title:"傳一個他沒問、但用得到的資訊",tip:"從他提過的事找題材，例如小孩上學、出國、買房。",tpl:"{name}您好，上次您提到（他提過的事），這份資料我整理好了，您可以先存著。"},
    {day:5,title:"問一個回一句話就好的問題",tip:"回得越短，越容易回。",tpl:"{name}您好，想請教一下，您比較在意的是保費，還是保障範圍呢？"},
    {day:7,title:"約下次見面：給兩個時間",tip:"給兩個時間，不問要不要。",tpl:"{name}您好，我下週二（{tue}）、週四（{thu}）晚上都有空，哪天方便把剩下的聊完？"}
  ],
  proposalSteps:[

function blank(){return{opps:[],clients:[],followups:[],policies:[],done:{},settings:structuredCloneSafe(DEFAULT_SETTINGS),seeded:false}}
function structuredCloneSafe(o){return JSON.parse(JSON.stringify(o))}
function load(){
  let s=null;
  try{const raw=localStorage.getItem(KEY); if(raw) s=JSON.parse(raw);}catch(e){}
  if(!s){s=blank(); seed(s);}
  s.settings=Object.assign(structuredCloneSafe(DEFAULT_SETTINGS),s.settings||{});
  s.settings.tpl=Object.assign(structuredCloneSafe(DEFAULT_SETTINGS.tpl),(s.settings&&s.settings.tpl)||{});
  s.done=s.done||{};
  s.opps=s.opps||[];
  for(const c of s.clients){ if(!c.stage){ /* 舊資料：依追蹤紀錄推估階段 */
    const ts=s.followups.filter(f=>f.clientId===c.id).map(f=>f.type);
    c.stage=ts.includes("deal")?"A":ts.includes("proposal")?"B":ts.includes("meet")?"C":"D"; } }

}

/* ---------- 日期工具 ---------- */
const WD="日一二三四五六";
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function parseD(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function diff(a,b){return Math.round((a-b)/86400000)}
function fmt(d){return (d.getMonth()+1)+"/"+d.getDate()+"（"+WD[d.getDay()]+"）"}
function fmtY(d){return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()}
function clampDate(y,m,d){const last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(d,last))}
/* 跳歲日 = 生日 + 6 個月（保險年齡以足歲計，超過 6 個月加 1 歲） */
function nextAgeJump(bday,from){
  const [m,d]=bday.split("-").map(Number);
  for(let y=from.getFullYear()-1;y<=from.getFullYear()+1;y++){
    let mm=m-1+6, yy=y; if(mm>11){mm-=12;yy++;}
    const j=clampDate(yy,mm,d);
    if(j>=from) return j;
  }
}
function nextBirthday(bday,from){
  const [m,d]=bday.split("-").map(Number);
  for(let y=from.getFullYear();y<=from.getFullYear()+1;y++){const b=clampDate(y,m-1,d); if(b>=from) return b;}
}
function nextAnniversary(eff,from){
  const e=parseD(eff);
  for(let y=Math.max(e.getFullYear()+1,from.getFullYear()-1);y<=from.getFullYear()+2;y++){
    const a=clampDate(y,e.getMonth(),e.getDate()); if(a>=from) return a;
  }
}

const TYPES={
  meet:{label:"見面追蹤",color:"var(--c-meet)"},
  proposal:{label:"建議書追蹤",color:"var(--c-prop)"},
  deal:{label:"成交關懷",color:"var(--c-deal)"},

};
const RIDER={none:"無",exclusion:"批註（除外責任）",loading:"加費",both:"批註＋加費"};
function client(id){return state.clients.find(c=>c.id===id)}
const STAGES={
  A:{label:"已成交",color:"var(--c-deal)"},
  B:{label:"有興趣，已給建議書",color:"var(--c-prop)"},
  C:{label:"已見過面",color:"var(--c-anni)"},
  D:{label:"只有聯絡方式",color:"var(--muted)"}};
const STAGE_RANK={D:0,C:1,B:2,A:3}, IMPLIED={meet:"C",proposal:"B",deal:"A"};
function bumpStage(c,type){const st=IMPLIED[type]; if(c&&st&&STAGE_RANK[st]>STAGE_RANK[c.stage||"D"]) c.stage=st;}
function stageHTML(c){const st=c.stage||"D";return `<span class="stage" style="--sc:${STAGES[st].color}" title="${st}級：${STAGES[st].label}">${st}</span>`}
function stagePick(id,cur){return `<div class="stagepick" id="${id}">${Object.entries(STAGES).map(([k,v])=>`<button type="button" data-stage="${k}" aria-pressed="${k===cur}" style="--sc:${v.color}"><b>${k}</b>${v.label}</button>`).join("")}</div>`}
const FU_LABEL={meet:"見面",proposal:"給建議書",deal:"成交"};
function isFollow(type){return type in FU_LABEL}
function flow(type){const S=state.settings;
  if(type==="meet") return S.meetSteps;
  if(type==="proposal") return S.proposalSteps;
  if(type==="deal") return S.dealSteps;
  return S.proposalDays.map(n=>({day:n}));}
function waitsText(f){
  if(f.type!=="deal"||f.wait===false) return "無";
  const b=parseD(f.date);
  return state.settings.waitSteps.map(st=>st.title.replace("等待期結束","")+" "+st.day+" 天（到 "+fmtY(addDays(b,st.day))+"）").join("、");}
function dayLabel(n){return n===0?"當天":"第"+n+"天"}
function slots(due){const toMon=((8-due.getDay())%7)||7, mon=addDays(due,toMon);
  const f=d=>(d.getMonth()+1)+"/"+d.getDate(); return {tue:f(addDays(mon,1)),thu:f(addDays(mon,3))};}
function buildTasks(){
  const t=today(), S=state.settings, out=[];
  const grace=addDays(t,-30);
  for(const f of state.followups){
    const c=client(f.clientId); if(!c) continue;
    if(f.type==="meet"&&!f.track) continue;  /* 單純見面只記錄，不啟動 7 天追蹤 */
    const steps=flow(f.type).filter(st=>!st.silent);
    const base=parseD(f.date);
    steps.forEach((st,i)=>{
      const n=st.day, key="fu:"+f.id+":"+n; if(state.done[key]) return;
      const due=addDays(base,n);
      const head=FU_LABEL[f.type]+(n===0?"當天":"後第 "+n+" 天")+"（"+(i+1)+"/"+steps.length+"）";
      out.push({key,type:f.type,c,due,target:due,item:f.item,tip:st.tip,stepTpl:st.tpl,alts:st.alts,premium:f.premium,waits:waitsText(f),
        detail:head+(st.title?" · "+st.title:"")+(f.item?" · "+f.item:"")});
    });
  }
  for(const f of state.followups){
    if(f.type!=="deal"||f.wait===false) continue;
    const c=client(f.clientId); if(!c) continue;
    const base=parseD(f.date);
    for(const st of S.waitSteps){
      const key="wt:"+f.id+":"+st.day; if(state.done[key]) continue;
      const due=addDays(base,st.day);
      out.push({key,type:"wait",c,due,target:due,item:f.item,tip:st.tip,stepTpl:st.tpl,
        detail:"成交後第 "+st.day+" 天 · "+st.title+(f.item?" · "+f.item:"")});
    }
  }
  for(const p of state.policies){
    const c=client(p.clientId); if(!c) continue;
    if(p.monthly&&p.signDate){const key="fd:"+p.id+":"+p.signDate;
      if(!state.done[key]){const due=addDays(parseD(p.signDate),S.fundDays);
        out.push({key,type:"fund",c,due,target:due,item:p.name,tip:"順便說明第一次配息大約什麼時候入帳、怎麼查詢。",
          detail:p.name+" · 月配息 · "+fmtY(parseD(p.signDate))+" 簽收後第 "+S.fundDays+" 天"});}}
    const a=nextAnniversary(p.eff,grace);
    if(a){const key="an:"+p.id+":"+ymd(a);
      if(!state.done[key]) out.push({key,type:"anni",c,due:addDays(a,-S.anniLead),target:a,item:p.name,detail:p.name+" · "+fmtY(a)+" 滿 "+(a.getFullYear()-parseD(p.eff).getFullYear())+" 週年"});}
    if(p.rider&&p.rider!=="none"&&p.reviewDate){
      const key="rd:"+p.id+":"+p.reviewDate;
      if(!state.done[key]){const r=parseD(p.reviewDate);
        out.push({key,type:"rider",c,due:addDays(r,-S.riderLead),target:r,item:p.name,kind:RIDER[p.rider],detail:p.name+" · "+RIDER[p.rider]+" · "+fmtY(r)+" 可申請複查"+(p.note?" · "+p.note:"")});}
    }
  }
  for(const c of state.clients){
    if(!c.bday) continue;
    const j=nextAgeJump(c.bday,t); if(!j) continue;  /* 跳歲日已過就不再提醒 */
    const steps=[...S.ageSteps].sort((a,b)=>b.lead-a.lead);
    steps.forEach((st,i)=>{
      const key="ag:"+c.id+":"+ymd(j)+":"+st.lead; if(state.done[key]) return;
      const due=addDays(j,-st.lead), nxt=steps[i+1];
      if(nxt&&t>=addDays(j,-nxt.lead)) return;  /* 下一階段開始後，前一階段不再顯示 */
      out.push({key,type:"age",c,due,target:j,tip:st.tip,stepTpl:st.tpl,
        detail:"跳歲前 "+st.lead+" 天 · "+st.title+" · 生日 "+c.bday.replace("-","/")+"，"+fmtY(j)+" 保險年齡 +1"});
    });
  }
  out.sort((a,b)=>a.due-b.due);
  return out;
}
function message(task){
  const tpl=task.stepTpl!=null?task.stepTpl:(state.settings.tpl[task.type]||"");
  const sl=slots(task.due);
  return tpl.replaceAll("{next1}",fmt(addDays(task.due,1))).replaceAll("{next2}",fmt(addDays(task.due,2))).replaceAll("{tue}",sl.tue).replaceAll("{thu}",sl.thu).replaceAll("{name}",task.c.name).replaceAll("{item}",task.item||"保單")
    .replaceAll("{date}",fmtY(task.target)).replaceAll("{kind}",task.kind||"")
    .replaceAll("{premium}",task.premium||"（保費）").replaceAll("{waits}",task.waits||"無");
}

function esc(s){return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function addMonths(d,n){return clampDate(d.getFullYear(),d.getMonth()+n,d.getDate())}
/* A 級：最後一次成交滿半年且沒有新成交 → 依近半年紀錄降回 B／C／D（每筆成交只自動調整一次） */
function applyStageRules(){
  const t=today(), since=addMonths(t,-6); let changed=0;
  for(const c of state.clients){
    if(c.stage!=="A") continue;
    const fs=state.followups.filter(f=>f.clientId===c.id);
    const deals=fs.filter(f=>f.type==="deal").map(f=>f.date).sort();
    if(!deals.length) continue;
    const last=deals[deals.length-1];
    if(c.stageAutoFrom===last) continue;
    if(t<addMonths(parseD(last),6)) continue;
    const recent=fs.filter(f=>parseD(f.date)>=since).map(f=>f.type);
    c.stage=recent.includes("proposal")?"B":recent.includes("meet")?"C":"D";
    c.stageAutoFrom=last; c.stageAutoOn=ymd(t); changed++;
  }
  if(changed){save(); setTimeout(()=>toast(changed+" 位客戶成交已滿半年，階段已自動調整"),300);}
}

  applyStageRules();

  else when=dt<0?"已過 "+(-dt)+" 天":dt===0?"就是今天":(d<=0?"":"提醒 "+fmt(k.due)+" · ")+"還有 "+dt+" 天";
  const msgs=k.alts?k.alts.map(a=>({label:a.label,text:message(Object.assign({},k,{stepTpl:a.tpl}))})):[{label:"",text:message(k)}];

      <button class="btn small primary" data-done="${esc(k.key)}">✓ 已聯絡</button>
    </div></article>`;
}

        <div class="inline"><label for="ad_${i}">跳歲前</label><input id="ad_${i}" type="number" min="1" value="${st.lead}"><label>天　${esc(st.title)}</label></div>
        <span class="hint">${esc(st.tip)}</span>
        <textarea id="at_${i}" rows="4" aria-label="${esc(st.title)}訊息">${esc(st.tpl)}</textarea></div>`).join("")}
      <h2>月配息基金進場</h2>
      <div class="field"><label for="sF">保單簽收後第幾天提醒</label><input id="sF" type="number" min="1" value="${S.fundDays}"></div>
      <h2>提前幾天提醒</h2>
      <div class="inline">
        <div class="field" style="flex:1"><label for="sA">保單週年</label><input id="sA" type="number" min="0" value="${S.anniLead}"></div>
        <div class="field" style="flex:1"><label for="sR">批註/加費</label><input id="sR" type="number" min="0" value="${S.riderLead}"></div>
      </div>
      <h2>訊息範本</h2>
      <p class="note" style="margin:0">可用代碼：{name} 客戶、{item} 商品/保單、{date} 日期、{kind} 批註或加費</p>
      ${Object.keys(TYPES).filter(k=>!["meet","age","proposal","wait"].includes(k)).map(k=>`<div class="field"><label for="t_${k}">${TYPES[k].label}</label><textarea id="t_${k}" rows="3">${esc(S.tpl[k])}</textarea></div>`).join("")}
      <div class="actions"><button class="btn primary" type="submit">儲存設定</button></div>
    </form>
    <div class="card">
      <h2>備份與還原</h2>
      <p class="note" style="margin:0">資料只存在這支手機的瀏覽器裡，不會上傳。換手機或清除瀏覽器前，請先備份：複製備份碼貼到 LINE 的 Keep 或記事本保存。</p>
      <div class="actions"><button class="btn" id="exp">複製備份碼</button><button class="btn" id="imp">貼上備份碼還原</button></div>
    </div>
    <div class="card"><h2>關於跳歲</h2><p class="note" style="margin:0">保險年齡以足歲計算，未滿 6 個月不計、超過 6 個月加 1 歲，所以「跳歲日」＝生日後 6 個月。只輸入月和日就能算出。</p></div>`;
  document.getElementById("setF").onsubmit=e=>{
    e.preventDefault();
    const nums=v=>[...new Set(v.split(/[,，\s]+/).map(Number).filter(n=>Number.isInteger(n)&&n>0))].sort((a,b)=>a-b);
    const $=id=>document.getElementById(id);
    S.dealSteps.forEach((st,i)=>{st.day=Math.max(0,parseInt($("dd_"+i).value)||st.day);
      if(st.alts) st.alts.forEach((a,j)=>a.tpl=$("da_"+i+"_"+j).value); else if(st.tpl!=null) st.tpl=$("dt_"+i).value;});
    S.dealSteps.sort((a,b)=>a.day-b.day);
    S.fundDays=Math.max(1,parseInt($("sF").value)||12);
    S.waitSteps.forEach((st,i)=>{st.day=Math.max(1,parseInt($("wd_"+i).value)||st.day); st.tpl=$("wtp_"+i).value;});
    S.proposalSteps.forEach((st,i)=>{st.day=Math.max(0,parseInt($("pd_"+i).value)||0); st.tpl=$("pt_"+i).value;});
    S.proposalSteps.sort((a,b)=>a.day-b.day);
    S.anniLead=Math.max(0,+$("sA").value||0); S.riderLead=Math.max(0,+$("sR").value||0);
    for(const k of Object.keys(TYPES)) if(!["meet","age","proposal","wait"].includes(k)) S.tpl[k]=$("t_"+k).value;
    S.meetSteps.forEach((st,i)=>{st.day=Math.max(0,parseInt($("md_"+i).value)||0); if(!st.silent) st.tpl=$("mt_"+i).value;});
    S.meetSteps.sort((a,b)=>a.day-b.day);
    S.ageSteps.forEach((st,i)=>{st.lead=Math.max(1,parseInt($("ad_"+i).value)||st.lead); st.tpl=$("at_"+i).value;});
    const tg=[...new Set($("sTags").value.split(/[、,，\s]+/).map(x=>x.trim()).filter(Boolean))];
    if(tg.length) S.tags=tg;
    save(); toast("設定已儲存"); render();
  };
  document.getElementById("exp").onclick=()=>copy(JSON.stringify(state),"備份碼已複製");
  document.getElementById("imp").onclick=importSheet;
}
function bindCommon(){
  view.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copy(b.dataset.copy,"訊息已複製，可貼到 LINE"));
  view.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{openClient=b.dataset.open;render();});
  view.querySelectorAll("[data-card]").forEach(el=>el.onclick=e=>{if(e.target.closest("button,a,input,textarea,select"))return;openClient=el.dataset.card;render();});
  view.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{state.done[b.dataset.done]=Date.now();save();render();toast("已標記完成");});
}

/* ---------- 抽屜表單 ---------- */
const root=document.getElementById("sheetRoot");
function openSheet(html,onReady){
  root.innerHTML=`<div class="sheet-bg" id="bg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const bg=document.getElementById("bg");
  bg.onclick=e=>{if(e.target===bg)closeSheet();};
  root.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  onReady&&onReady(root.querySelector(".sheet"));
}
function closeSheet(){root.innerHTML="";}
function confirmSheet(title,body,ok){
  openSheet(`<h3>${esc(title)}</h3>${body?`<p class="note" style="margin:0">${esc(body)}</p>`:""}<div class="actions"><button class="btn" data-close>取消</button><button class="btn primary" id="ok">確定</button></div>`,
    ()=>document.getElementById("ok").onclick=()=>{closeSheet();ok();});
}
const MASK=/[ＯO○〇◯ｏ]/;
function autoMask(n){
  n=n.trim().replace(/\s+/g,"");
  if(n.length<=1) return n+"Ｏ";
  if(n.length===2) return n[0]+"Ｏ";
  return n[0]+"Ｏ".repeat(n.length-2)+n[n.length-1];
}
function clientSheet(c){
  const isNew=!c; c=c||{name:"",bday:"",note:""};
  const [bm,bd]=(c.bday||"-").split("-");
  openSheet(`<h3>${isNew?"新增客戶":"編輯客戶"}</h3>
    <form id="cf" style="display:flex;flex-direction:column;gap:14px">
      <div class="field"><label for="cn">客戶姓名（中間用 Ｏ）</label>
        <div class="inline"><input id="cn" value="${esc(c.name)}" placeholder="例：陳Ｏ華" autocomplete="off" style="flex:1"><button type="button" class="btn" id="mask">自動遮罩</button></div>
        <span class="hint">輸入全名後按「自動遮罩」，會變成 陳Ｏ華。不儲存完整姓名。</span><span class="err" id="cnErr"></span></div>
      <div class="field"><label>生日（只填月、日）</label>
        <div class="inline"><select id="bm" aria-label="月" style="flex:1"><option value="">月</option>${Array.from({length:12},(_,i)=>`<option value="${pad2(i+1)}" ${bm===pad2(i+1)?"selected":""}>${i+1} 月</option>`).join("")}</select>
        <select id="bd" aria-label="日" style="flex:1"><option value="">日</option>${Array.from({length:31},(_,i)=>`<option value="${pad2(i+1)}" ${bd===pad2(i+1)?"selected":""}>${i+1} 日</option>`).join("")}</select></div>
        <label class="inline bdu"><input type="checkbox" id="bdu" ${c.bdayUnknown?"checked":""}> 不知道生日</label>
        <span class="hint">用來計算跳歲日，不需要年份。</span></div>
      <div class="field"><label>客戶階段（必選）</label>${stagePick("sp",isNew?"":c.stage||"D")}<span class="err" id="spErr"></span></div>
      <div class="field"><label>標籤（可複選）</label>
        <div class="tagpick" id="tp">${[...new Set([...state.settings.tags,...(c.tags||[])])].map(x=>`<button type="button" data-tag="${esc(x)}" aria-pressed="${(c.tags||[]).includes(x)}">${esc(x)}</button>`).join("")}</div>
        <div class="inline"><input id="newTag" placeholder="自訂標籤" style="flex:1"><button type="button" class="btn" id="addTag">加入</button></div></div>
      <div class="field"><label for="cnote">客戶筆記（新資訊、喜好、家庭狀況）</label><textarea id="cnote" rows="3" placeholder="例：老大明年上小學、喜歡下午聯絡">${esc(c.note||"")}</textarea><span class="hint">寫模糊一點：不寫病名、檢查數值、身分證字號、電話、地址。例如寫「有體況」「有加費」，細節回公司系統查。</span></div>
      ${isNew?`<div class="field"><label for="next">剛剛發生什麼事？</label><select id="next"><option value="meet" selected>剛見完客戶</option><option value="">只建檔</option><option value="proposal">剛給完建議書</option><option value="deal">剛成交</option></select></div>
      <label class="inline" id="trackF" style="font-size:14px"><input type="checkbox" id="track" style="width:auto"> 同時啟動見面後 7 天追蹤（單純見面取得資訊就不用勾）</label>
      <div class="field" id="itemF"><label for="item">商品名稱（可不填）</label><input id="item" placeholder="例：醫療險"></div>
      <div class="field" id="premF" hidden><label for="prem">保費</label><input id="prem" placeholder="例：年繳 36,000 元"></div>`:""}
      <div class="actions"><button type="button" class="btn" data-close>取消</button><button class="btn primary" type="submit">儲存</button></div>
    </form>`,()=>{
    const cn=document.getElementById("cn");
    document.getElementById("mask").onclick=()=>{if(cn.value.trim()&&!MASK.test(cn.value))cn.value=autoMask(cn.value);};
    const bdu=document.getElementById("bdu"), bmS=document.getElementById("bm"), bdS=document.getElementById("bd");
    const syncBdu=()=>{bmS.disabled=bdS.disabled=bdu.checked; if(bdu.checked){bmS.value="";bdS.value="";}};
    bdu.onchange=syncBdu; syncBdu();
    const sp=document.getElementById("sp");
    const setStage=k=>sp.querySelectorAll("[data-stage]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.stage===k));
    const curStage=()=>{const b=sp.querySelector('[aria-pressed="true"]');return b?b.dataset.stage:"";};
    sp.querySelectorAll("[data-stage]").forEach(b=>b.onclick=()=>{setStage(b.dataset.stage);document.getElementById("spErr").textContent="";});
    const nx=document.getElementById("next"); if(nx) nx.onchange=()=>{const im=IMPLIED[nx.value]; if(im&&(!curStage()||STAGE_RANK[im]>STAGE_RANK[curStage()])) setStage(im);document.getElementById("itemF").hidden=!nx.value;document.getElementById("premF").hidden=nx.value!=="deal";document.getElementById("trackF").hidden=nx.value!=="meet";};
    const tp=document.getElementById("tp");
    const bindTags=()=>tp.querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true"));
    bindTags();
    document.getElementById("addTag").onclick=()=>{const v=document.getElementById("newTag").value.trim();if(!v)return;
      let b=[...tp.querySelectorAll("[data-tag]")].find(x=>x.dataset.tag===v);
      if(!b){b=document.createElement("button");b.type="button";b.dataset.tag=v;b.textContent=v;tp.appendChild(b);bindTags();}
      b.setAttribute("aria-pressed","true");document.getElementById("newTag").value="";
      if(!state.settings.tags.includes(v)) state.settings.tags.push(v);};
    if(isNew) cn.focus();
    document.getElementById("cf").onsubmit=e=>{
      e.preventDefault();
      const name=cn.value.trim().replace(/[O○〇◯ｏ]/g,"Ｏ"), err=document.getElementById("cnErr");
      if(!name){err.textContent="請輸入姓名";return;}
      if(!MASK.test(name)){err.textContent="姓名中間需要有 Ｏ，可按「自動遮罩」";return;}
      const m=document.getElementById("bm").value, d=document.getElementById("bd").value;
      if((m&&!d)||(!m&&d)){err.textContent="生日的月、日要一起填";return;}
      if(m&&d&&+d>new Date(2024,+m,0).getDate()){err.textContent="這個月沒有 "+(+d)+" 日";return;}
      const stage=curStage(); if(!stage){document.getElementById("spErr").textContent="請選擇客戶階段（A／B／C／D）";return;}
      const data={name,stage,bday:m&&d?m+"-"+d:"",bdayUnknown:bdu.checked,note:document.getElementById("cnote").value.trim(),
        tags:[...tp.querySelectorAll('[data-tag][aria-pressed="true"]')].map(b=>b.dataset.tag)};
      let id;
      if(isNew){id=uid();state.clients.push(Object.assign({id},data));
        if(nx&&nx.value){bumpStage(state.clients[state.clients.length-1],nx.value);} 
        if(nx&&nx.value) state.followups.push({id:uid(),clientId:id,type:nx.value,date:ymd(today()),item:document.getElementById("item").value.trim(),premium:nx.value==="deal"?document.getElementById("prem").value.trim():undefined,track:nx.value==="meet"?document.getElementById("track").checked:undefined});
      }else{Object.assign(c,data);id=c.id;}
      save();closeSheet();openClient=id;render();toast(isNew?"已新增客戶":"已更新");
    };
  });
}
function followupSheet(clientId,type){
  const steps=flow(type).filter(st=>!st.silent);
  openSheet(`<h3>${type==="meet"?"剛見完客戶":type==="proposal"?"剛給完建議書":"剛成交"}</h3>
    <form id="ff" style="display:flex;flex-direction:column;gap:14px">
      <div class="field"><label for="fi">商品名稱${type==="meet"?"（可不填）":""}</label><input id="fi" placeholder="例：實支實付醫療險"></div>
      ${type==="deal"?`<div class="field"><label for="fp">保費</label><input id="fp" placeholder="例：年繳 36,000 元"></div>`:""}
      <div class="field"><label for="fd">日期</label><input id="fd" type="date" value="${ymd(today())}"></div>
      ${type==="meet"?`<label class="inline" style="font-size:14px"><input type="checkbox" id="ftrack" style="width:auto"> 啟動 7 天追蹤（${steps.map(st=>dayLabel(st.day)).join("、")}提醒）</label><p class="note" style="margin:0">單純見面取得資訊就不用勾，只會記錄見面日期。</p>`:`<p class="note" style="margin:0">會在${steps.map(st=>dayLabel(st.day)).join("、")}提醒你傳訊息（可在設定修改）。</p>`}
      ${type==="deal"?`<label class="inline" style="font-size:14px"><input type="checkbox" id="fw" checked style="width:auto"> 提醒等待期結束（${state.settings.waitSteps.map(st=>st.title.replace("等待期結束","")+" "+st.day+" 天").join("、")}）</label>`:""}
      <div class="actions"><button type="button" class="btn" data-close>取消</button><button class="btn primary" type="submit">建立提醒</button></div>
    </form>`,()=>{
    document.getElementById("ff").onsubmit=e=>{e.preventDefault();
      const d=document.getElementById("fd").value; if(!d) return toast("請選擇日期");
      const fw=document.getElementById("fw");
      const fp=document.getElementById("fp");
      state.followups.push({id:uid(),clientId,type,date:d,item:document.getElementById("fi").value.trim(),wait:fw?fw.checked:undefined,premium:fp?fp.value.trim():undefined,track:type==="meet"?document.getElementById("ftrack").checked:undefined});
      const cl=client(clientId), before=cl&&cl.stage; bumpStage(cl,type);
      save();closeSheet();render();const what=type==="meet"&&!document.getElementById("ftrack")?.checked?"已記錄見面":"已建立提醒";
      toast(cl&&cl.stage!==before?what+"，客戶升為 "+cl.stage+" 級":what);};
  });
}
function policySheet(clientId,p){
  const isNew=!p; p=p||{name:"",eff:"",rider:"none",reviewDate:"",note:""};
  openSheet(`<h3>${isNew?"新增保單":"編輯保單"}</h3>
    <form id="pf" style="display:flex;flex-direction:column;gap:14px">
      <div class="field"><label for="pn">險種 / 保單名稱</label><input id="pn" value="${esc(p.name)}" placeholder="例：終身醫療險"></div>
      <div class="field"><label for="pe">保單生效日</label><input id="pe" type="date" value="${esc(p.eff)}"><span class="hint">用來提醒保單週年日</span></div>
      <div class="field"><label for="pr">批註 / 加費</label><select id="pr">${Object.entries(RIDER).map(([k,v])=>`<option value="${k}" ${p.rider===k?"selected":""}>${v}</option>`).join("")}</select></div>
      <div class="field" id="rvF" ${p.rider==="none"?"hidden":""}><label for="pv">可申請複查（拿掉批註/加費）日期</label>
        <input id="pv" type="date" value="${esc(p.reviewDate)}">
        <div class="actions"><button type="button" class="btn small" data-plus="6">生效後半年</button><button type="button" class="btn small" data-plus="12">生效後 1 年</button><button type="button" class="btn small" data-plus="24">生效後 2 年</button></div></div>
      <label class="inline" style="font-size:14px;font-weight:700"><input type="checkbox" id="pm" ${p.monthly?"checked":""} style="width:auto"> 月配息類型商品</label>
      <div class="field" id="pmF" ${p.monthly?"":"hidden"}><label for="ps">保單簽收日</label><input id="ps" type="date" value="${esc(p.signDate||"")}">
        <span class="hint">簽收後第 ${state.settings.fundDays} 天提醒你告訴客戶基金已經進場（天數可在設定修改）</span></div>
      <div class="field"><label for="pno">備註（例：需附健檢報告）</label><textarea id="pno" rows="2">${esc(p.note)}</textarea><span class="hint">寫模糊一點：不寫病名、檢查數值、身分證字號、電話、地址。例如寫「有體況」「有加費」，細節回公司系統查。</span></div>
      <div class="actions">${isNew?"":`<button type="button" class="btn danger" id="pdel" style="margin-right:auto">刪除</button>`}<button type="button" class="btn" data-close>取消</button><button class="btn primary" type="submit">儲存</button></div>
    </form>`,()=>{
    const pr=document.getElementById("pr"), pe=document.getElementById("pe"), pv=document.getElementById("pv");
    pr.onchange=()=>document.getElementById("rvF").hidden=pr.value==="none";
    const pm=document.getElementById("pm"); pm.onchange=()=>document.getElementById("pmF").hidden=!pm.checked;
    root.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>{
      if(!pe.value) return toast("請先填生效日");
      const e=parseD(pe.value);pv.value=ymd(clampDate(e.getFullYear(),e.getMonth()+ +b.dataset.plus,e.getDate()));});
    const del=document.getElementById("pdel");
    if(del) del.onclick=()=>{state.policies=state.policies.filter(x=>x.id!==p.id);save();closeSheet();render();toast("已刪除保單");};
    document.getElementById("pf").onsubmit=e=>{e.preventDefault();
      const name=document.getElementById("pn").value.trim();
      if(!name) return toast("請填保單名稱"); if(!pe.value) return toast("請填生效日");
      if(pr.value!=="none"&&!pv.value) return toast("請填可申請複查的日期");
      const data={name,eff:pe.value,rider:pr.value,reviewDate:pr.value==="none"?"":pv.value,note:document.getElementById("pno").value.trim(),
        monthly:pm.checked,signDate:pm.checked?document.getElementById("ps").value:""};
      if(isNew) state.policies.push(Object.assign({id:uid(),clientId},data)); else Object.assign(p,data);
      save();closeSheet();render();toast("已儲存保單");};
  });
}
function importSheet(){
  openSheet(`<h3>貼上備份碼還原</h3>
    <div class="field"><label for="impT">備份碼</label><textarea id="impT" rows="6" placeholder="把先前複製的備份碼貼在這裡"></textarea>
    <span class="hint">還原會取代這支手機上現有的資料。</span><span class="err" id="impE"></span></div>
    <div class="actions"><button class="btn" data-close>取消</button><button class="btn primary" id="impGo">還原</button></div>`,()=>{
    document.getElementById("impGo").onclick=()=>{
      try{const s=JSON.parse(document.getElementById("impT").value);
        if(!Array.isArray(s.clients)) throw 0;
        state=s; save(); state=load(); closeSheet(); tab="today"; render(); toast("已還原 "+state.clients.length+" 位客戶");
      }catch(e){document.getElementById("impE").textContent="備份碼格式不正確，請確認完整複製。";}
    };
  });
}

/* ---------- 小工具 ---------- */
let toastT;
function toast(msg){
  let t=document.querySelector(".toast"); if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}
  t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2200);
}
function copy(text,okMsg){
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand("copy");}catch(e){} ta.remove();
    if(ok) toast(okMsg); else openSheet(`<h3>請手動複製</h3><textarea rows="6" readonly style="width:100%">${esc(text)}</textarea><div class="actions"><button class="btn primary" data-close>完成</button></div>`,s=>{const a=s.querySelector("textarea");a.focus();a.select();});};
  try{navigator.clipboard.writeText(text).then(()=>toast(okMsg),fallback);}catch(e){fallback();}
}

document.querySelectorAll("nav .tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;openClient=null;render();});
document.getElementById("fab").onclick=()=>clientSheet();
document.addEventListener("visibilitychange",()=>{if(!document.hidden) render();});
if(!localStorage) {}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
render();
})();
</script>
